[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "againward"
version = "0.1.0"
description = "Local evidence-grounded investigation tools"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
againward = "againward.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["againward*", "energy_mvp*"]

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["againward/documents/**/*.py", "againward/domains/rental/document_*.py", "againward/domains/rental/temporal.py", "tests/test_document_*.py", "tests/test_rental_document_*.py", "tests/test_rental_temporal.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["againward/documents"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
