name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Install synthetic scan renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Run test suite
        run: python -m pytest -q
      - name: Check document boundary quality
        run: |
          python -m pip install 'ruff>=0.11,<1' 'mypy>=1.15,<2'
          ruff check .
          python -m mypy
          ruff check --no-force-exclude againward/domains/rental/case_graph*.py againward/domains/rental/case_investigator*.py againward/domains/rental/case_post_calculation.py tests/test_rental_case_graph*.py tests/test_rental_case_investigator.py
          python -m mypy againward/domains/rental/case_graph*.py againward/domains/rental/case_investigator*.py againward/domains/rental/case_post_calculation.py
